<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
 
body{
    background:#f5f5f5;
    padding:40px;
}
 
h1{
    text-align:center;
    margin-bottom:40px;
}
 
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
}
 
.card{
    background:white;
    border:2px solid #333;
    padding:20px;
    text-align:center;
    border-radius:10px;
}
 
.card h2{
    margin-bottom:15px;
}
 
/* calc() */
 
.calc{
    width:calc(100% - 200px);
    max-width:500px;
    background:#FFE082;
}
 
/* min() */
 
.min{
    width:min(500px,80%);
    background:#81D4FA;
}
 
/* max() */
 
.max{
    width:max(300px,50%);
    background:#A5D6A7;
}
 
/* clamp() */
 
.clamp{
    width:clamp(300px,60%,700px);
    background:#FFAB91;
}
 
.clamp h2{
    font-size:clamp(20px,3vw,40px);
}
 
    </style>
</head>

<body>
    	
<h1>CSS Functions Demo</h1>
 
<div class="container">
 
    <div class="card calc">
        <h2>calc()</h2>
        <p>width: calc(100% - 200px);</p>
    </div>
 
    <div class="card min">
        <h2>min()</h2>
        <p>width: min(500px, 80%);</p>
    </div>
 
    <div class="card max">
        <h2>max()</h2>
        <p>width: max(300px, 50%);</p>
    </div>
 
    <div class="card clamp">
        <h2>clamp()</h2>
        <p>width: clamp(300px, 60%, 700px);</p>
    </div>
 
</div>
</body>

</html>
